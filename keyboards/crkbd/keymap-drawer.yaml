# https://keymap-drawer.streamlit.app/

layout:
  qmk_keyboard: corne_rotated
  layout_name: LAYOUT_split_3x5_3
layers:
  DEF:
    - [Q, W, E, R, T, Y, U, I, O, P]
    - [A, S, D, F, G, H, J, K, L, ";"]
    - [Z, X, C, V, B, N, M, ",", ., /]
    # Left Thumbs
    - { t: OSM LAlt, h: LAlt }
    - { t: OSM LCtrl, h: LCtrl }
    - { t: OSM LShift, h: LShift }
    # Right Thumbs
    - { t: Space }
    - { t: SYM, type: held } # TO(_SYM)
    - { t: OSM LGui, h: Gui }

  SYM:
    - [Esc, "@", "#", "$", "%", "^", "&", "*", "!", BSpace]
    - [Tab, "=", "+", "-", "_", "{", "(", ")", "}", Enter]
    - [{t: FUN, type: held}, "`", "~", "|", "\\", "[", '"', "'", "]", {t: NAV, type: held}]
    # Left Thumbs
    - { t: OSM LCtrl, h: LCtrl }
    - { t: DEF, type: held }
    - { t: OSM LShift, h: LShift }
    # Right Thumbs
    - { t: Space }
    - { t: NUM, type: held }
    - { t: OSM LCtrl, h: LCtrl }

  NAV:
    - [Esc, Btn1, MsUp, Btn2, {type: trans}, WhL, WhD, WhU, WhR, BSpace]
    - [Tab, MsLeft, MsDown, MsRight, {type: trans}, Left, Down, Up, Right, Enter]
    - [{t: FUN, type: held}, LWin, Btn3, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {t: NAV, type: held}]
    # Left Thumbs
    - { t: OSM LCtrl, h: LCtrl }
    - { t: DEF, type: held }
    - { t: OSM LShift, h: LShift }
    # Right Thumbs
    - { t: Space }
    - { t: NUM, type: held }
    - { t: OSM LCtrl, h: LCtrl }

  NUM:
    - [Esc, Cap Word, Scroll, NumLk, PgUp, Home, "7", "8", "9", BSpace]
    - [S(Tab), S(X), S(C), S(V), PgDn, End, "4", "5", "6", Enter]
    - [{t: FUN, type: held}, Ins, Undo, Redo, Del, "0", "1", "2", "3", {t: NAV, type: held}]
    # Left Thumbs
    - { t: OSM RCtrl, h: RCtrl }
    - { t: DEF, type: held }
    - { type: trans }
    # Right Thumbs
    - { t: OSM LShift, h: LShift }
    - { t: Space }
    - { t: SYM, type: held }

  FUN:
    - [Esc, Bri Dn, {type: trans}, Bri Up, {type: trans}, F9, F10, F11, F12, BSpace]
    - [Tab, Prev, Play, Next, {type: trans}, F5, F6, F7, F8, Enter]
    - [{t: FUN, type: held}, {type: trans}, Mute, {type: trans}, {t: SET, type: held}, F1, F2, F3, F4, {t: NAV, type: held}]
    # Left Thumbs
    - { t: OSM LCtrl, h: LCtrl }
    - { t: DEF, type: held }
    - { type: trans }
    # Right Thumbs
    - { t: OSM LShift, h: LShift }
    - { t: Space }
    - { t: NUM, type: held }

  SET:
    - [Esc, {type: none}, {type: none}, {type: none}, {type: none}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, BSpace]
    - [Tab, {type: none}, {type: none}, {type: none}, EE Clr, {type: trans}, Boot, {type: none}, Reset, Enter]
    - [{t: FUN, type: held}, {type: none}, {type: none}, {type: none}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {t: NAV, type: held}]
    # Left Thumbs
    - { t: OSM LCtrl, h: LCtrl }
    - { t: DEF, type: held }
    - { type: trans }
    # Right Thumbs
    - { t: OSM LShift, h: LShift }
    - { t: Space }
    - { t: NUM, type: held }

combos:
  - { p: [16, 17], k: Enter, l: [DEF] }
  - { p: [3, 4], k: Tab, l: [DEF] }
  - { p: [5, 6], k: C(BS), l: [DEF] }
  - { p: [15, 16], k: BSpace, l: [DEF] }
  - { p: [5, 15], k: Left, l: [DEF] }
  - { p: [6, 16], k: Right, l: [DEF] }